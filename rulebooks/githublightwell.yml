---
- name: Listen for events on a webhook from GitHub Actions
  hosts: all
  sources:
    - name: Listen for alerts from GitHub Actions
      eda.builtin.webhook:
        host: 0.0.0.0
        port: 4997

  rules:
    - name: New Application Build Completed for Restoration
      condition: event.payload.image_tag is defined and event.payload.is_merge == false
      action:
        run_workflow_template:
          name: "Lightwell Podman and Deployed App Reset"
          organization: "Infrastructure"
          job_args:
            extra_vars:
              image_tag: "{{ event.payload.image_tag }}"

    - name: RNew Application Build Completed for Lightwell Usage
      condition: event.payload.image_tag is defined and event.payload.is_merge == false
      action:
        run_job_template:
          name: "EDA Automated Response Automation Orchestrator"
          organization: Infrastructure
          job_args:
            extra_vars:
              image_tag: "{{ event.payload.image_tag }}"
              ao_webhook_path: "{{ ao_webhook_path }}"
